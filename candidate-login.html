<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Login | RankersBoard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #14213d;
    }
    header {
      background: white;
      padding: 18px 7%;
      border-bottom: 1px solid #e2e8f0;
    }
    header a {
      color: #14213d;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }
    main {
      max-width: 440px;
      margin: 35px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #14213d12;
    }
    h1 { margin-top: 0; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: #2457d6;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .switch {
      background: #eaf0ff;
      color: #2457d6;
    }
    #message {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>

<style id="rankersboard-monochrome-theme">
:root{color-scheme:light;--rb-black:#111111;--rb-ink:#171717;--rb-muted:#6b6b6b;--rb-paper:#ffffff;--rb-soft:#f5f5f3;--rb-line:#e5e5e2;--rb-shadow:0 12px 32px rgba(0,0,0,.07)}
html,body{background:var(--rb-paper)!important;color:var(--rb-ink)!important}
body{font-family:Inter,Arial,Helvetica,sans-serif!important}
a{color:var(--rb-ink)!important}
header,nav,.navbar,.topbar,.sidebar,.site-header{background:#fff!important;color:#111!important;border-color:var(--rb-line)!important;box-shadow:0 4px 20px rgba(0,0,0,.035)}
button,.btn,.button,input[type=submit],input[type=button],a.btn,a.button{background:#111!important;background-image:none!important;color:#fff!important;border:1px solid #111!important;border-radius:999px!important;box-shadow:none!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover,a.btn:hover,a.button:hover{background:#333!important;color:#fff!important}
button.secondary,.btn-secondary,.secondary-button,a.secondary{background:#fff!important;color:#111!important;border:1px solid #cfcfcb!important}
.card,.panel,.tile,.stat-card,.course-card,.test-card,.content-card,.modal-content{background:#fff!important;color:#171717!important;border:1px solid var(--rb-line)!important;border-radius:18px!important;box-shadow:var(--rb-shadow)!important}
input,select,textarea{background:#fff!important;color:#171717!important;border:1px solid #d8d8d4!important;border-radius:10px!important}
.badge,.tag,.pill{background:#f1f1ef!important;color:#222!important;border:1px solid #e1e1dd!important}
footer{background:#111!important;color:#fff!important}
[style*="#315efb"],[style*="#2563eb"],[style*="#3b82f6"],[style*="blue"],[style*="#1e40af"],[style*="#101b35"]{ }
</style>

</head>
<body>
  <header>
    <a href="index.html">🎓 RankersBoard</a>
  </header>

  <main>
    <h1 id="heading">Candidate Login</h1>

    <form id="auth-form">
      <div id="name-field" hidden>
        <label for="name">Full Name</label>
        <input id="name" type="text" maxlength="80" autocomplete="name">
      </div>

      <label for="email">Email Address</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Password (minimum 8 characters)</label>
      <input id="password" type="password" required minlength="8"
        autocomplete="current-password">

      <button id="submit-button" type="submit">Login</button>
    </form>

    <button id="switch-button" class="switch" type="button">
      Create New Account
    </button>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="index.html">Back to Home</a></p>
  </main>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const form = document.querySelector("#auth-form");
    const nameField = document.querySelector("#name-field");
    const nameInput = document.querySelector("#name");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    const heading = document.querySelector("#heading");
    const submitButton = document.querySelector("#submit-button");
    const switchButton = document.querySelector("#switch-button");
    const message = document.querySelector("#message");

    let isSignup = false;

    switchButton.addEventListener("click", () => {
      isSignup = !isSignup;
      heading.textContent = isSignup
        ? "Create Candidate Account" : "Candidate Login";
      submitButton.textContent = isSignup
        ? "Register" : "Login";
      switchButton.textContent = isSignup
        ? "Already have an account? Login"
        : "Create New Account";
      nameField.hidden = !isSignup;
      nameInput.required = isSignup;
      passwordInput.autocomplete = isSignup
        ? "new-password" : "current-password";
      message.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      message.style.color = "#14213d";
      message.textContent = "Please wait...";

      try {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        let result;

        if (isSignup) {
          result = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: nameInput.value.trim() },
              emailRedirectTo: new URL(
                "candidate-login.html", window.location.href
              ).href
            }
          });
        } else {
          result = await supabase.auth.signInWithPassword({
            email,
            password
          });
        }

        if (result.error) throw result.error;

        if (isSignup && !result.data.session) {
          message.style.color = "#167647";
          message.textContent =
            "Account request received. Check your email for a confirmation link, then return here to log in.";
        } else {
          message.style.color = "#167647";
          message.textContent = isSignup
            ? "Account created successfully!"
            : "Login successful!";

          if (result.data.session) {
            window.location.href = "ssc-cgl.html";
          }
        }
      } catch (error) {
        message.style.color = "#b42318";
        message.textContent = error.message ||
          "Something went wrong. Please try again.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
<div style="text-align:center;font-size:10px;line-height:1.4;color:#8b8b8b;opacity:.78;padding:8px 12px 14px;letter-spacing:.2px;">Powered by Dark Vision by Sachit</div>
</body>
</html>
