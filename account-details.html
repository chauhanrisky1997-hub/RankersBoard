<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account Details | RankersBoard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #17213a;
    }

    header {
      background: #101b35;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #8eacff;
    }

    .header-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      width: 92%;
      margin: 38px auto;
    }

    .page-heading {
      margin-bottom: 25px;
    }

    .page-heading h1 {
      margin: 0 0 9px;
      font-size: 30px;
    }

    .page-heading p {
      color: #64708a;
      line-height: 1.6;
    }

    .profile-card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      border: 1px solid #e1e7f2;
      box-shadow: 0 8px 28px rgba(16, 27, 53, 0.06);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e8edf5;
      margin-bottom: 8px;
    }

    .avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8efff;
      color: #315efb;
      font-size: 27px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .profile-top h2 {
      margin: 0 0 6px;
      font-size: 21px;
      overflow-wrap: anywhere;
    }

    .profile-top p {
      margin: 0;
      color: #64708a;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .detail-row {
      padding: 19px 0;
      border-bottom: 1px solid #edf0f6;
    }

    .detail-label {
      display: block;
      color: #64708a;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .candidate-id {
      font-size: 13px;
      font-weight: 500;
      word-break: break-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      background: #315efb;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #244bd1;
    }

    .btn-secondary {
      background: #e8efff;
      color: #244bd1;
    }

    .btn-secondary:hover {
      background: #dbe5ff;
    }

    .status {
      background: #e8efff;
      color: #263f85;
      border-radius: 9px;
      padding: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .status.error {
      background: #fff0f0;
      color: #a52222;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #748098;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .page-heading h1 {
        font-size: 25px;
      }

      .profile-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      Rankers<span>Board</span>
    </a>
  </header>

  <main class="container">
    <div class="page-heading">
      <h1>Account Details</h1>
      <p>View your registered account information.</p>
    </div>

    <div id="status" class="status" role="status">
      Loading account details...
    </div>

    <section id="profileCard" class="profile-card" hidden>
      <div class="profile-top">
        <div class="avatar" id="avatar">C</div>

        <div>
          <h2 id="profileName">Candidate</h2>
          <p id="profileEmail">Loading email...</p>
        </div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Full Name</span>
        <div class="detail-value" id="fullName">—</div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Registered Email</span>
        <div class="detail-value" id="email">—</div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Account Creation Date</span>
        <div class="detail-value" id="createdAt">—</div>
      </div>

      <div class="detail-row">
        <span class="detail-label">Candidate ID</span>
        <div class="detail-value candidate-id" id="candidateId">—</div>
      </div>

      <div class="actions">
  <button type="button" id="logoutBtn" class="btn btn-secondary">
          Logout
        </button>
      </div>
    </section>
  </main>

  <footer>
    © 2026 RankersBoard. Practice. Improve. Succeed.
  </footer>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const statusBox = document.getElementById("status");
    const profileCard = document.getElementById("profileCard");

    function showError(message) {
      statusBox.textContent = message;
      statusBox.classList.add("error");
    }

    async function loadAccountDetails() {
      try {
        const { data, error } = await supabase.auth.getUser();

        if (error || !data.user) {
          window.location.replace("candidate-login.html");
          return;
        }

        const user = data.user;
        const fullName =
          user.user_metadata?.full_name || "Candidate";

        const email = user.email || "Not available";

        let creationDate = "Not available";

        if (user.created_at) {
          creationDate = new Date(user.created_at).toLocaleDateString(
            "en-IN",
            {
              day: "2-digit",
              month: "long",
              year: "numeric"
            }
          );
        }

        document.getElementById("profileName").textContent = fullName;
        document.getElementById("profileEmail").textContent = email;
        document.getElementById("fullName").textContent = fullName;
        document.getElementById("email").textContent = email;
        document.getElementById("createdAt").textContent = creationDate;
        document.getElementById("candidateId").textContent = user.id;
        document.getElementById("avatar").textContent =
          fullName.charAt(0).toUpperCase();

        statusBox.hidden = true;
        profileCard.hidden = false;

      } catch (error) {
        showError(
          "Unable to load account details. Please refresh the page and try again."
        );
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      const button = document.getElementById("logoutBtn");
      button.disabled = true;
      button.textContent = "Logging out...";

      try {
        const { error } = await supabase.auth.signOut();

        if (error) {
          throw error;
        }

        window.location.replace("candidate-login.html");

      } catch (error) {
        button.disabled = false;
        button.textContent = "Logout";
        alert("Logout failed. Please try again.");
      }
    });

    loadAccountDetails();
  </script>
</body>
</html>
