<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC CGL 2024 General Awareness Tests | RankersBoard</title>
<style>
:root{color-scheme:light;--ink:#171717;--muted:#707070;--line:#e7e7e4;--paper:#fff;--soft:#f6f6f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
header{padding:18px max(5%,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#fff}
.logo{font-size:22px;font-weight:800;letter-spacing:-.7px;color:#111;text-decoration:none}.logo span{color:#777}
.back{font-size:13px;font-weight:650;text-decoration:none;color:#222;border:1px solid #d8d8d4;border-radius:999px;padding:9px 14px}
main{width:min(1080px,90%);margin:44px auto 70px}.hero{border:1px solid var(--line);border-radius:18px;padding:30px;background:var(--soft);margin-bottom:26px}
.eyebrow{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:#555}
h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1px;margin:13px 0 8px}.hero p{color:var(--muted);line-height:1.65;margin:0}
.section-head{margin:26px 0 15px}.section-head h2{font-size:22px;margin:0 0 5px}.section-head p{font-size:14px;color:var(--muted);margin:0}
#testList{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.test-card,.empty{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff}
.test-card h3{font-size:19px;margin:0 0 9px}.meta{font-size:13px;line-height:1.7;color:var(--muted);margin:4px 0}
.btn{display:inline-block;margin-top:13px;padding:11px 17px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-size:13px;font-weight:700;border:1px solid #111}
.btn:hover{background:#fff;color:#111}.empty{color:#666;line-height:1.65;grid-column:1/-1}
footer{text-align:center;border-top:1px solid var(--line);padding:24px;color:#888;font-size:12px}
@media(max-width:520px){main{margin:27px auto 48px}.hero{padding:22px}.test-card{padding:19px}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Rankers<span>Board</span></a><a class="back" href="ssc-cgl-2024.html">← Back</a></header>
<main>
<section class="hero"><span class="eyebrow">SSC CGL 2024</span><h1>GK Sectional</h1><p>Published 2024 SSC CGL papers. Select a date and shift to begin practising.</p></section>
<div class="section-head"><h2>Available Tests</h2><p>Published tests are added here automatically by the admin.</p></div>
<div id="testList"><div class="empty">Checking login and loading tests…</div></div>
</main>
<footer>© 2026 RankersBoard. Practice. Improve. Succeed.</footer>
<script type="module">
import { supabase } from "./supabase-client.js";
const CATEGORY = 'SSC CGL 2024';
const SUBJECT = 'gk';
const list = document.getElementById("testList");
function message(msg){const d=document.createElement("div");d.className="empty";d.textContent=msg;list.replaceChildren(d);}
function subjectMatches(value, key){
  if(!key || key==="all") return true;
  const s=(value||"").toLowerCase().replace(/[^a-z]/g,"");
  const groups={
    maths:["math","maths","quant","quantitativeaptitude"],
    reasoning:["reason","generalintelligence","logical"],
    english:["english","language"],
    gk:["gk","generalknowledge","generalawareness","awareness"]
  };
  return (groups[key]||[key]).some(term=>s.includes(term));
}
async function load(){
 try{
  const {data:auth,error:authError}=await supabase.auth.getUser();
  if(authError || !auth.user){location.replace("candidate-login.html?next="+encodeURIComponent(location.pathname.split("/").pop()));return;}
  const {data:cats,error:catError}=await supabase.from("rb_exam_categories").select("id,name").ilike("name",CATEGORY);
  if(catError) throw catError;
  if(!cats?.length){message("This exam category has not been created in Admin Dashboard yet. Add the matching category first.");return;}
  const ids=cats.map(c=>c.id);
  const {data:tests,error}=await supabase.from("rb_tests")
    .select("id,title,subject,section,duration_minutes,marks_per_correct,negative_marks,status,created_at,category_id")
    .in("category_id",ids).eq("status","published").order("created_at",{ascending:false});
  if(error) throw error;
  const filtered=(tests||[]).filter(t=>subjectMatches([t.subject,t.section].filter(Boolean).join(" "),SUBJECT));
  if(!filtered.length){message(SUBJECT==="all"?"No published tests are available in this category yet.":"No published "+SUBJECT+" tests are available in this category yet. Upload the papers in Admin Dashboard and publish them to show them here.");return;}
  list.replaceChildren();
  for(const t of filtered){
   const card=document.createElement("article");card.className="test-card";
   const h=document.createElement("h3");h.textContent=t.title;
   const cat=document.createElement("p");cat.className="meta";cat.textContent=CATEGORY;
   const subj=document.createElement("p");subj.className="meta";subj.textContent=[t.subject,t.section].filter(Boolean).join(" · ");
   const details=document.createElement("p");details.className="meta";details.textContent=`${t.duration_minutes} minutes · +${t.marks_per_correct} / −${t.negative_marks}`;
   const a=document.createElement("a");a.className="btn";a.textContent="Start Test →";a.href="mock-test.html?test_id="+encodeURIComponent(t.id);
   card.append(h,cat,subj,details,a);list.append(card);
  }
 }catch(e){console.error(e);message("Could not load tests. Refresh the page; if this continues, check Supabase permissions and category setup.");}
}
load();
</script>
</body>
</html>
