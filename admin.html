<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | RankersBoard</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fc;color:#17213a;font-family:Arial,sans-serif;padding:20px}
.card{width:min(440px,100%);background:#fff;border:1px solid #e3e8f2;border-radius:18px;padding:32px;box-shadow:0 15px 45px #17213a12}
h1{margin:0 0 8px;font-size:28px}.muted{color:#657087;line-height:1.5}label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cfd7e6;border-radius:9px;font-size:15px}
button{width:100%;margin-top:22px;padding:13px;background:#315efb;color:white;border:0;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}#msg{min-height:24px;margin-top:15px;font-size:14px;color:#b42318}a{color:#315efb}.credit{text-align:center;color:#9299a8;font-size:10px;margin-top:22px}
</style></head><body><main class="card"><h1>RankersBoard Admin</h1><p class="muted">Sign in with your authorized shared administrator account.</p>
<form id="login"><label for="email">Admin email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button id="submit">Sign in</button></form>
<div id="msg" role="status"></div><p class="muted"><a href="index.html">← Back to website</a></p><div class="credit">Powered by Dark Vision by Sachit</div></main>
<script type="module">
import {supabase} from "./supabase-client.js";
const form=document.querySelector("#login"),btn=document.querySelector("#submit"),msg=document.querySelector("#msg");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;msg.style.color="#334155";msg.textContent="Checking account…";
try{const {data,error}=await supabase.auth.signInWithPassword({email:document.querySelector("#email").value.trim(),password:document.querySelector("#password").value});if(error)throw error;
const check=await supabase.from("rb_admin_users").select("user_id").eq("user_id",data.user.id).maybeSingle();
if(check.error)throw check.error;if(!check.data){await supabase.auth.signOut();throw new Error("This account is not authorized as a RankersBoard admin. Ask the project owner to grant admin access.");}
location.href="admin-dashboard.html";
}catch(err){msg.style.color="#b42318";msg.textContent=err.message||"Login failed.";}finally{btn.disabled=false;}});
</script></body></html>
